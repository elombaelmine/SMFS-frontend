<header class="sfms-header">
  <div class="header-left">
    <h1>Smart Farm Management</h1>
  </div>
  
  <div class="header-center">
    <div class="search-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" class="header-search" placeholder="Search field grid...">
    </div>
  </div>
  
  <div class="header-right">
    <div class="sync-status">
      <span class="status-dot green"></span>
      <span class="status-text">Network: Stable</span>
    </div>
    <div class="sync-timestamp">Last Sync: 2m ago</div>
    <button class="btn-emergency-stop">Emergency Stop</button>
  </div>
</header>
